name: Build Anymore Vayu NetHunter Kernel
on: [workflow_dispatch]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout kernel source
uses: actions/checkout@v4
with:
repository: AnymoreProject/android_kernel_vayu
ref: 0f8b1c04302094439718fa5d8d9122d9f89a730b
path: kernel

  - name: Checkout build config
    uses: actions/checkout@v4
    with:
      path: config

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

  - name: Restore configuration
    run: |
      test -s config/vayu.config
      mkdir -p kernel/out
      cp config/vayu.config kernel/out/.config
      cd kernel
      scripts/config --enable CFG80211
      scripts/config --enable MAC80211
      scripts/config --enable USB_HID
      scripts/config --enable USB_F_HID
      scripts/config --enable USB_CONFIGFS_F_HID
      scripts/config --enable ATH9K_HTC
      scripts/config --enable RTL8187
      scripts/config --enable RT2X00
      scripts/config --enable RT2800USB
      make O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

  - name: Compile kernel
    run: |
      cd kernel
      make -j2 O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image dtbo.img

  - name: Upload build outputs
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: vayu-kernel-build
      path: |
        kernel/out/arch/arm64/boot/Image
        kernel/out/arch/arm64/boot/dtbo.img
      if-no-files-found: error
      retention-days: 7
